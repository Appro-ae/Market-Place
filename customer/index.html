<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Appro · Customer Portal</title>
  <link rel="icon" href="../assets/logos/appro-logo-color.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/design-system.css">
  <style>
    body { margin: 0; min-height: 100vh; background: var(--navy-900);
      background-image: radial-gradient(1000px 500px at 80% -10%, rgba(59,126,246,.22), transparent 60%);
      color: #fff; font-family: var(--font-ui); display: flex; align-items: center; justify-content: center; text-align: center; }
    .wrap { width: min(620px, 90vw); padding: 48px 0; }
    img { height: 32px; }
    .tag { margin-top: 18px; display: inline-block; font-size: 11px; letter-spacing: .16em; font-weight: 700; text-transform: uppercase; color: var(--warning); border: 1px solid rgba(235,190,0,.4); border-radius: 999px; padding: 5px 12px; }
    h1 { font-family: var(--font-display); font-size: 30px; letter-spacing: -0.02em; margin: 22px 0 12px; color: #fff; }
    p { font-size: 15px; line-height: 1.6; color: rgba(255,255,255,.72); margin: 0 auto 28px; max-width: 480px; }
    a.back { color: var(--appro-blue-400); font-weight: 700; text-decoration: none; font-size: 14px; }
  </style>
</head>
<body>
  <div class="wrap">
    <img src="../assets/logos/appro-logo-white.svg" alt="Appro">
    <div class="tag">Reconstruction pending</div>
    <h1>Customer Portal</h1>
    <p>The shared shell, design system and login flow are already reconstructed from
       the admin reference. The tenant-facing screens (catalogue, API keys, usage,
       billing) are rebuilt once the Customer Portal standalone HTML is provided.</p>
    <a class="back" href="../">← Back to marketplace home</a>
  </div>
</body>
</html>
