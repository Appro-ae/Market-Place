<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:760px;height:300px;background:#fff;font-family:Arial,'Liberation Sans',sans-serif;padding:14px}
.card{border:1px solid #E5E5E5;border-radius:8px;overflow:hidden}
.hd{background:#003764;color:#fff;font-size:15px;font-weight:700;padding:11px 16px;letter-spacing:.3px}
.rows{padding:6px 16px 12px}
.r{display:flex;align-items:center;height:36px;border-bottom:1px solid #EFEFEF;font-size:15px}
.r:last-child{border-bottom:none}
.k{width:300px;color:#73787B}
.v{color:#404345;font-weight:700}
.new{margin-left:10px;background:#E5F2F6;color:#008AAB;font-size:11.5px;font-weight:700;
     padding:3px 8px;border-radius:10px;letter-spacing:.4px}
.chg{margin-left:10px;background:#FFF1E5;color:#C24A00;font-size:11.5px;font-weight:700;
     padding:3px 8px;border-radius:10px;letter-spacing:.4px}
</style></head><body>
<div class="card">
  <div class="hd">Application Enquiry &nbsp;&middot;&nbsp; Credit Queue &nbsp;&middot;&nbsp; Termination Queue</div>
  <div class="rows">
    <div class="r"><span class="k">AECB Score</span><span class="v">715</span></div>
    <div class="r"><span class="k">AECB Score Range</span><span class="v">M1 &ndash; Very High Risk</span><span class="chg">CODE ADDED</span></div>
    <div class="r"><span class="k">AECB Score Segment</span><span class="v">Mature</span><span class="new">NEW FIELD</span></div>
    <div class="r"><span class="k">Score Name</span><span class="v">Consumer Score 3.0 &ndash; Mature</span><span class="chg">CHANGED</span></div>
  </div>
</div>
</body></html>
