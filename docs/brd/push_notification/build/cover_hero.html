<!doctype html><html><head><meta charset="utf-8">
<!-- Cover hero: three real notifications from section 3.2, stacked. Shadows are baked into the
     PNG (rasterised by Chromium) — never CSS shadows in a PDF (runbook §8.1). -->
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1040px;height:470px;background:#fff;position:relative;overflow:hidden;font-family:Arial,'Liberation Sans',sans-serif}
.blob{position:absolute;border-radius:50%}
.card{position:absolute;display:flex;gap:16px;align-items:flex-start;width:640px;background:#F7F7FA;border:1px solid #E3E3EA;
      border-radius:24px;padding:18px 22px 20px;box-shadow:0 18px 40px rgba(26,33,77,.16),0 3px 8px rgba(26,33,77,.08)}
.icon{flex:0 0 48px;height:48px;border-radius:12px;background:#003764;display:flex;align-items:center;justify-content:center}
.txt{flex:1}
.hd{display:flex;justify-content:space-between;font-size:13px;letter-spacing:.7px;color:#6E6E78;margin-bottom:5px}
.t{font-size:18px;font-weight:700;color:#1a1a1a;line-height:1.3}
.b{font-size:16px;color:#2b2b30;line-height:1.35;margin-top:3px}
</style></head><body>
<div class="blob" style="left:500px;top:-120px;width:540px;height:540px;background:radial-gradient(circle,#DCE6FF 0%,#EDF2FF 55%,rgba(237,242,255,0) 72%)"></div>
<div class="blob" style="left:-40px;top:270px;width:200px;height:200px;background:radial-gradient(circle,#FFF2CC 0%,rgba(255,242,204,0) 70%)"></div>
<div id="stack"></div>
<script>
const bell = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>';
const C = [ // back to front — copy exactly as section 3.2
  [300, 34, .90, .82, '5m ago', 'Direct debit is set up', 'Your bank approved your direct debit. Tap to view your loan.'],
  [230, 150, .95, .93, '2m ago', 'We need a document from you', 'Upload it to keep your application moving.'],
  [160, 272, 1, 1, 'now', 'Your Credit Card offer is ready', 'Tap to review your offer and continue your application.'],
];
for (const [x, y, s, o, when, t, b] of C) {
  document.getElementById('stack').insertAdjacentHTML('beforeend',
    `<div class="card" style="left:${x}px;top:${y}px;transform:scale(${s});transform-origin:left top;opacity:${o}">
       <div class="icon">${bell}</div><div class="txt"><div class="hd"><span>SUPER APP</span><span>${when}</span></div>
       <div class="t">${t}</div><div class="b">${b}</div></div></div>`);
}
</script>
</body></html>
