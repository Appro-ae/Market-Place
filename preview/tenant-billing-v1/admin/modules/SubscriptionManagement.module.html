<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subscription Management — Appro Admin Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0F1E3D;--brand:#2E5BFF;--brand-d:#2348D6;--accent:#FFC107;
    --text:#1F2A3D;--muted:#667085;--faint:#8A95A8;
    --line:#E7EBF2;--line-2:#EEF1F6;--bg:#F7F9FC;--surface:#fff;--soft:#EEF3FF;
    --ok:#16A34A;--ok-bg:#E7F6EC;--ok-tx:#127A3E;
    --amber:#D9930B;--amber-bg:#FBF1DC;--amber-tx:#9A6B12;
    --off:#DC2626;--off-bg:#FCEBEA;--off-tx:#B4231B;
    --grey:#64748B;--grey-bg:#EEF1F6;--grey-tx:#475569;
    --sh-sm:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.07);
    --sh-md:0 4px 14px rgba(16,24,40,.08);
    --sh-lg:-18px 0 40px rgba(16,24,40,.10);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:Lato,system-ui,Arial,sans-serif;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
  .wrap{padding:22px 26px 70px;max-width:1180px}
  .lh{display:flex;align-items:flex-start;gap:14px}
  .lh .ti{font-size:21px;font-weight:900;color:var(--navy);letter-spacing:-.01em}
  .lh .sub{font-size:12.5px;color:var(--muted);margin-top:3px;max-width:620px}
  .rolechip{margin-left:auto;font-size:11px;font-weight:800;color:var(--grey-tx);background:var(--grey-bg);padding:6px 11px;border-radius:8px;white-space:nowrap}

  /* boundary banner — the non-overlap contract */
  .boundary{display:flex;align-items:center;gap:11px;background:#F4F8FF;border:1px solid #D7E3FF;border-radius:12px;padding:11px 15px;margin:16px 0 20px}
  .boundary .bi{width:28px;height:28px;border-radius:8px;background:var(--soft);color:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:900;flex:0 0 auto}
  .boundary b{color:var(--navy);font-size:12.5px}.boundary span{color:var(--muted);font-size:12px}
  .boundary .lk{margin-left:auto;border:1px solid #C9D6FF;background:#fff;color:var(--brand);border-radius:9px;font:inherit;font-weight:800;font-size:12px;padding:8px 12px;cursor:pointer;white-space:nowrap}
  .boundary .lk:hover{background:var(--soft)}

  .seg{display:inline-flex;background:#EDF0F6;border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;margin-bottom:18px}
  .seg .chip{border:0;background:transparent;border-radius:7px;padding:9px 16px;font:inherit;font-weight:800;font-size:12.5px;color:var(--muted);cursor:pointer}
  .seg .chip.on{background:var(--surface);color:var(--navy);box-shadow:var(--sh-sm)}

  .kpis{display:grid;gap:13px;margin-bottom:18px;grid-template-columns:repeat(4,1fr)}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--sh-sm)}
  .kpi .l{font-size:10.5px;font-weight:800;color:var(--faint);text-transform:uppercase;letter-spacing:.05em}
  .kpi .v{font-size:25px;font-weight:900;color:var(--navy);margin-top:6px;line-height:1;font-variant-numeric:tabular-nums}
  .kpi .s{font-size:11px;color:var(--muted);margin-top:6px}

  .toolbar{display:flex;align-items:center;gap:9px;margin-bottom:13px;flex-wrap:wrap}
  .search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 11px;width:240px;color:var(--faint);box-shadow:var(--sh-sm)}
  .search input{border:0;background:none;outline:none;font:inherit;font-size:13px;width:100%;color:var(--text)}
  .sel{font:inherit;font-weight:800;font-size:12.5px;color:var(--navy);border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:var(--surface);box-shadow:var(--sh-sm);cursor:pointer}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--sh-sm)}
  .card h3{margin:0;padding:15px 18px;font-size:14px;font-weight:900;color:var(--navy);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
  .card h3 .cnt{margin-left:auto;font-size:11.5px;color:var(--faint);font-weight:800}
  table{width:100%;border-collapse:collapse}
  thead th{background:#FAFBFD;color:var(--faint);font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;text-align:left;padding:11px 18px;border-bottom:1px solid var(--line)}
  tbody td{padding:14px 18px;font-size:13.5px;border-bottom:1px solid var(--line-2)}
  tbody tr:last-child td{border-bottom:0}
  tbody tr.clk{cursor:pointer}tbody tr.clk:hover{background:#F8FAFD}
  .tid{font-size:11.5px;color:var(--faint);font-weight:700}
  .priceref{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--navy);font-weight:700}
  .priceref .src{font-size:10px;font-weight:800;padding:2px 7px;border-radius:6px}
  .src.cat{background:var(--grey-bg);color:var(--grey-tx)}.src.cust{background:var(--soft);color:var(--brand)}
  .empty{padding:44px;text-align:center;color:var(--faint);font-size:13px}
  .age{font-size:11px;font-weight:800;color:var(--amber-tx);background:var(--amber-bg);padding:2px 7px;border-radius:6px}
  .age.fresh{color:var(--grey-tx);background:var(--grey-bg)}

  .pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;padding:3px 10px 3px 8px;border-radius:999px}
  .pill .dt{width:6px;height:6px;border-radius:50%}
  .pill.Pending{background:var(--amber-bg);color:var(--amber-tx)}.pill.Pending .dt{background:var(--amber)}
  .pill.Active{background:var(--ok-bg);color:var(--ok-tx)}.pill.Active .dt{background:var(--ok)}
  .pill.Provisioning{background:var(--soft);color:var(--brand)}.pill.Provisioning .dt{background:var(--brand)}
  .pill.Failed{background:var(--off-bg);color:var(--off-tx)}.pill.Failed .dt{background:var(--off)}
  .pill.Rejected{background:var(--off-bg);color:var(--off-tx)}.pill.Rejected .dt{background:var(--off)}
  .pill.Cancelled{background:var(--grey-bg);color:var(--grey-tx)}.pill.Cancelled .dt{background:var(--grey)}
  .pill.Scheduled{background:var(--amber-bg);color:var(--amber-tx)}.pill.Scheduled .dt{background:var(--amber)}
  .pill.Cancelling{background:var(--grey-bg);color:var(--grey-tx)}.pill.Cancelling .dt{background:var(--grey)}
  .spin{width:10px;height:10px;border:2px solid #C9D6FF;border-top-color:var(--brand);border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
  @keyframes sp{to{transform:rotate(360deg)}}

  .btn{border:0;border-radius:10px;font:inherit;font-weight:800;cursor:pointer;padding:9px 15px;display:inline-flex;align-items:center;gap:7px;font-size:13px;transition:.15s}
  .btn.primary{background:var(--brand);color:#fff;box-shadow:0 1px 2px rgba(46,91,255,.4)}.btn.primary:hover{background:var(--brand-d)}
  .btn.ghost{background:var(--surface);border:1px solid var(--line);color:var(--navy);box-shadow:var(--sh-sm)}.btn.ghost:hover{background:#F7F9FC}
  .btn.danger{background:var(--off-bg);color:var(--off-tx);border:1px solid #F4C9C6}.btn.danger:hover{background:#FBDEDC}
  .btn.sm{padding:7px 12px;font-size:12px}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .lk2{border:1px solid #C9D6FF;background:#fff;color:var(--brand);border-radius:9px;font:inherit;font-weight:800;font-size:12px;padding:7px 11px;cursor:pointer}.lk2:hover{background:var(--soft)}

  /* drawer */
  .scrim{position:fixed;inset:0;background:rgba(16,24,40,.4);opacity:0;pointer-events:none;transition:.2s;z-index:20}
  .scrim.on{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;height:100%;width:460px;max-width:95vw;background:var(--surface);box-shadow:var(--sh-lg);transform:translateX(102%);transition:transform .26s cubic-bezier(.4,0,.2,1);z-index:21;display:flex;flex-direction:column}
  .drawer.on{transform:translateX(0)}
  .dh{display:flex;align-items:center;gap:12px;padding:17px 21px;border-bottom:1px solid var(--line);flex:0 0 auto}
  .dh .ic{width:36px;height:36px;border-radius:10px;background:var(--amber-bg);color:var(--amber-tx);display:flex;align-items:center;justify-content:center;font-weight:900}
  .dh b{font-size:15px;color:var(--navy);display:block}.dh small{color:var(--faint);font-size:11.5px;font-weight:700}
  .dh .x{margin-left:auto;border:0;background:transparent;font-size:23px;color:var(--faint);cursor:pointer;padding:2px 8px;border-radius:8px}.dh .x:hover{background:var(--bg);color:var(--navy)}
  .db{padding:6px 21px 18px;overflow:auto;flex:1}
  .df{padding:14px 21px;border-top:1px solid var(--line);display:flex;gap:9px;flex:0 0 auto}.df .btn{flex:1;justify-content:center}
  .seclbl{font-size:10.5px;font-weight:800;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;margin:18px 0 9px;display:flex;align-items:center;gap:8px}
  .owned{font-size:9.5px;font-weight:800;color:var(--grey-tx);background:var(--grey-bg);padding:2px 7px;border-radius:5px;letter-spacing:.02em}
  .box{border:1px solid var(--line);border-radius:11px;padding:13px 14px;background:#FCFDFF}
  .kv{display:flex;justify-content:space-between;gap:14px;padding:7px 0;border-bottom:1px dashed var(--line-2);font-size:13px}
  .kv:last-child{border-bottom:0}.kv span{color:var(--muted)}.kv b{color:var(--navy);text-align:right}
  .pricebox{border:1px solid #D7E3FF;background:#F4F8FF;border-radius:11px;padding:13px 14px}
  .pricebox .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .pricebox .big{font-size:15px;font-weight:900;color:var(--navy)}
  .pricebox .hint{font-size:11px;color:var(--muted);margin-top:8px}
  .field{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line-2)}
  .field:last-child{border-bottom:0}.field .fn{font-size:13px;color:var(--navy);font-weight:700}.field .fk{font-size:11px;color:var(--faint);margin-top:1px}
  .lock{margin-left:auto;font-size:10.5px;font-weight:800;color:var(--grey-tx);background:var(--grey-bg);padding:3px 8px;border-radius:6px}
  .sw{margin-left:auto;width:38px;height:22px;border-radius:999px;background:#CBD5E1;position:relative;cursor:pointer;transition:.16s;flex:0 0 auto}
  .sw.on{background:var(--brand)}.sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.16s}.sw.on::after{left:18px}
  .audit{margin-top:2px}.audit .ev{font-size:12px;color:var(--muted);padding:6px 0;border-bottom:1px dashed var(--line-2);display:flex;gap:8px}.audit .ev:last-child{border-bottom:0}
  .audit .ev .ed{width:7px;height:7px;border-radius:50%;background:var(--brand);margin-top:5px;flex:0 0 auto}.audit .ev b{color:var(--navy)}.audit .ev time{margin-left:auto;color:var(--faint);font-size:11px;white-space:nowrap}
  .failnote{font-size:11.5px;color:var(--off-tx);background:var(--off-bg);border:1px solid #F4C9C6;border-radius:9px;padding:9px 11px;margin-top:10px;display:flex;align-items:center;gap:10px}
  .failnote .btn{margin-left:auto}

  /* sub cards (lifecycle) */
  .subcard{border:1px solid var(--line);border-radius:11px;margin-bottom:11px;overflow:hidden;box-shadow:var(--sh-sm);background:var(--surface)}
  .subhead{display:flex;align-items:center;gap:13px;padding:14px 16px;cursor:pointer}.subhead:hover{background:#F8FAFD}
  .subhead .pn{font-weight:900;color:var(--navy);font-size:14px}.subhead .meta{font-size:12px;color:var(--muted);margin-top:2px}
  .subhead .pr{margin-left:auto;text-align:right}.caret{color:var(--faint);font-size:12px;transition:.18s;margin-left:4px}.caret.open{transform:rotate(90deg)}
  .subbody{display:none;padding:4px 16px 16px;border-top:1px solid var(--line-2);background:#FCFDFF}.subbody.open{display:block}
  .gridcfg{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:12px}
  @media(max-width:820px){.gridcfg{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}.drawer{width:100%}}

  .mscrim{position:fixed;inset:0;background:rgba(16,24,40,.4);display:none;align-items:center;justify-content:center;z-index:40;padding:20px}.mscrim.on{display:flex}
  .modal{background:var(--surface);border-radius:14px;box-shadow:var(--sh-md);width:430px;max-width:100%;overflow:hidden}
  .modal h4{margin:0;padding:18px 21px 4px;font-size:16px;font-weight:900;color:var(--navy)}.modal p{margin:0;padding:0 21px;font-size:13px;color:var(--muted)}
  .modal .mb{padding:13px 21px}.modal textarea,.modal select{width:100%;font:inherit;font-size:13.5px;border:1px solid var(--line);border-radius:9px;padding:10px 12px;color:var(--navy);margin-bottom:9px}
  .modal .mf{padding:4px 21px 18px;display:flex;gap:9px;justify-content:flex-end}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:11px 18px;border-radius:11px;font-size:13px;font-weight:700;box-shadow:var(--sh-md);opacity:0;pointer-events:none;transition:.22s;z-index:60}.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .fhead{font-size:11.5px;font-weight:800;color:var(--muted);margin:2px 0 8px}
  .fgrp{display:flex;align-items:center;justify-content:space-between;margin:13px 0 4px;font-size:10px;font-weight:800;color:var(--brand);text-transform:uppercase;letter-spacing:.05em}
  .fgrp:first-child{margin-top:2px}
  .fga{display:flex;gap:6px}
  .fgbtn{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:6px;font:inherit;font-weight:800;font-size:10px;padding:2px 8px;cursor:pointer}.fgbtn:hover{background:var(--bg)}
  .fchk{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line-2);cursor:pointer}
  .fchk.lk{cursor:default}.fchk:last-child{border-bottom:0}
  .fchk .fn{font-size:12.5px;color:var(--navy);font-weight:700}
  .fchk .fk{margin-left:auto;font-size:10.5px;color:var(--faint)}
  .fchk .req{font-size:9px;font-weight:800;color:var(--grey-tx);background:var(--grey-bg);padding:1px 6px;border-radius:5px;margin-left:6px}
  .cbx{width:18px;height:18px;border-radius:5px;border:1.5px solid #CBD5E1;background:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .cbx.on{background:var(--brand);border-color:var(--brand)}
  .cbx.on::after{content:"";width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);margin-top:-2px}
  .cbx.lock:not(.on){background:var(--grey-bg)}.cbx.lock.on{background:#9AA6BE;border-color:#9AA6BE}
  .fchk .cbx{margin-left:0}
  .pdetail{font-size:12px;color:var(--navy);font-weight:700;margin-top:6px}
  .vhint{font-size:11px;color:var(--faint);margin-top:6px}
  .optrow{display:flex;flex-direction:column;gap:8px;margin-bottom:6px}
  .opt{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--navy);padding:9px 11px;border:1px solid var(--line);border-radius:9px;cursor:pointer}
  .opt input{accent-color:var(--brand);margin:0;flex:0 0 auto}
  .flbl{display:block;font-size:11px;font-weight:800;color:var(--muted);margin-bottom:5px}
  .modal input[type=date]{width:100%;font:inherit;font-size:13.5px;border:1px solid var(--line);border-radius:9px;padding:9px 12px;color:var(--navy)}
  .schednote{background:var(--amber-bg);border:1px solid var(--amber);color:var(--amber-tx);border-radius:11px;padding:12px 14px;font-size:12.5px;margin-top:10px;line-height:1.5}
  .snbtns{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="wrap">
  <div class="lh">
    <div>
      <div class="ti">Subscription Management</div>
    </div>
    <span class="rolechip">Role · Subscriptions (excl. billing)</span>
  </div>

  <!-- SINGLE SCREEN — all requests + subscriptions -->
  <div id="tab-list">
    <div class="kpis" id="listKpis"></div>
    <div class="toolbar">
      <div class="search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><input id="listSearch" placeholder="Search tenant or tenant ID…" oninput="renderList()"></div>
      <select class="sel" id="fProd" onchange="renderList()"><option value="">All products</option></select>
      <select class="sel" id="fCust" onchange="renderList()"><option value="">All tenants</option></select>
    </div>
    <div class="card">
      <h3>Requests &amp; subscriptions <span class="cnt" id="listCount"></span></h3>
      <table><thead><tr><th>Tenant</th><th>Product</th><th>Package</th><th>Date</th><th>Status</th><th></th></tr></thead><tbody id="listBody"></tbody></table>
    </div>
  </div>
</div>

<div class="scrim" id="scrim" onclick="closeDrawer()"></div>
<aside class="drawer" id="drawer">
  <div class="dh"><div class="ic" id="dIc">!</div><div><b id="dName">—</b><small id="dSub">—</small></div><button class="x" style="margin-left:auto" onclick="closeDrawer()">&times;</button></div>
  <div class="db" id="dBody"></div>
  <div class="df" id="dFoot"></div>
</aside>

<div class="mscrim" id="mscrim"><div class="modal"><h4 id="mTitle">Confirm</h4><p id="mMsg"></p><div class="mb" id="mBody"></div><div class="mf"><button class="btn ghost sm" onclick="closeModal()">Cancel</button><button class="btn primary sm" id="mOk">Confirm</button></div></div></div>
<div class="toast" id="toast"></div>

<script>
var ME="amira.saleh@appro.ae";
function dt(s){return new Date(s);}
function fmtDate(d){return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});}
function fmtTime(d){return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'})+' '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});}
function daysAgo(d){return Math.floor((Date.now()-d.getTime())/864e5);}
function statusLabel(st){return {Scheduled:'Scheduled to cancel',Cancelling:'Cancelling'}[st]||st;}

/* products: outbound fields are THIS module's concern. Pricing is NOT here — only a priceRef label resolved from Billing. */
var PRODUCTS={
  cs:{name:"Credit Score (Individual)",fields:[
    {g:"Request references",items:[{id:"appId",name:"Appro application ID",k:"approApplicationId"},{id:"respId",name:"Response ID",k:"NAE_RES.ResponseId"},{id:"cbContract",name:"CB contract ID",k:"NewApplication.CBContractId"},{id:"provApp",name:"Provider application no",k:"NewApplication.ProviderApplicationNo"}]},
    {g:"Enquired subject",items:[{id:"enqName",name:"Full name (EN)",k:"EnquiredSubject.FullNameEN"},{id:"enqGender",name:"Gender",k:"EnquiredSubject.Gender"},{id:"enqDob",name:"Date of birth",k:"EnquiredSubject.DOB"},{id:"enqNat",name:"Nationality",k:"EnquiredSubject.Nationality"},{id:"enqEid",name:"Emirates ID",k:"EnquiredSubject.EmiratesId"},{id:"enqMob",name:"Primary mobile no",k:"EnquiredSubject.PrimaryMobileNo"}]},
    {g:"Matched subject",items:[{id:"mSubId",name:"CB subject ID",k:"MatchedSubject.CBSubjectId"},{id:"mName",name:"Full name (EN)",k:"MatchedSubject.FullNameEN"},{id:"mNameHist",name:"Name history",k:"MatchedSubject.FullNameENHistory"}]},
    {g:"Score",items:[{id:"scoreIdx",name:"Credit score (index)",k:"Score.Data.Index",mand:true},{id:"scoreRange",name:"Score range",k:"Score.Data.Range"}]}
  ]},
  cfr:{name:"Credit Full Report (Individual)",fields:[
    {g:"Identity & profile",items:[{id:"cbSubId",name:"CB subject ID (match)",k:"MatchedSubject.CBSubjectId",mand:true},{id:"fullName",name:"Full name (EN)",k:"Individual.FullNameEN"},{id:"nameHist",name:"Name history",k:"Individual.FullNameENHistory"},{id:"gender",name:"Gender",k:"Individual.Gender"},{id:"dob",name:"Date of birth",k:"Individual.DOB"},{id:"nat",name:"Nationality",k:"Individual.NationalityHistory"},{id:"resident",name:"Resident flag",k:"Individual.ResidentFlag"},{id:"eid",name:"Emirates ID",k:"Individual.EmiratesIdHistory"},{id:"passport",name:"Passport",k:"Individual.PassportHistory"},{id:"address",name:"Address history",k:"Individual.AddressHistory"},{id:"contact",name:"Contact history (phone / email)",k:"Individual.ContactHistory"}]},
    {g:"Credit score",items:[{id:"score",name:"Bureau score (index)",k:"Score.Index"},{id:"scoreRange",name:"Score range",k:"Score.Range"}]},
    {g:"Contracts & accounts",items:[{id:"contractsSummary",name:"Contracts summary",k:"ContractsSummary"},{id:"contractData",name:"Contract details",k:"Contract.ContractData"},{id:"contractType",name:"Contract type / status",k:"Contract.ContractType"},{id:"creditCards",name:"Credit cards",k:"CreditCards"},{id:"installments",name:"Installments / loans",k:"Installments"},{id:"flags",name:"Secured / Islamic flags",k:"Contract.SecuredContractFlag"}]},
    {g:"Financial summary",items:[{id:"finSummary",name:"Financial summary",k:"FinancialSummary"},{id:"keyValues",name:"Key values summary",k:"KeyValuesSummary"},{id:"numbers",name:"Numbers summary",k:"NumbersSummary"},{id:"telco",name:"Telco / utilities summary",k:"NumbersSummaryTelcoUtilities"}]},

    if(f.group!==last){last=f.group;html+='<div class="fgrp"><span>'+f.group+'</span><span class="fga"><button class="fgbtn" onclick="grpAll('+i+',true)">All</button><button class="fgbtn" onclick="grpAll('+i+',false)">None</button></span></div>';}
    html+='<label class="fchk'+(f.mand?' lk':'')+'"'+(f.mand?'':' onclick="dtf('+i+')"')+'><span class="cbx'+(f.on?' on':'')+(f.mand?' lock':'')+'"></span><span class="fn">'+f.name+(f.mand?' <span class="req">required</span>':'')+'</span><span class="fk">'+f.k+'</span></label>';
  });
  document.getElementById('dFlds').innerHTML=html;
}
function dtf(i){DRAFT.fields[i].on=!DRAFT.fields[i].on;renderDFields();}
function grpAll(i,on){var g=DRAFT.fields[i].group;DRAFT.fields.forEach(function(f){if(f.group===g&&!f.mand)f.on=on;});renderDFields();}

function doApprove(id){}
function doReject(id){}

/* ---- LIFECYCLE (single screen: cancel / schedule flows run through the modal; renderLife → renderList, openBody → no-op) ---- */
function fillLifeTenant(){}
function byId(id){return SUBS.filter(function(x){return x.id===id;})[0];}
function term(s){var d=dt(s.approvedAt);d.setFullYear(d.getFullYear()+1);return d;}
function ymd(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function cmode(){document.getElementById('cdate').style.display=document.querySelector('input[name=cmode]:checked').value==='sched'?'block':'none';}
function fireCancel(s,effAt,txt){s.status='Cancelling';s.effectiveCancelAt=effAt;s.cancelledBy=ME;s.cancelReason=txt;s.audit.push({t:new Date().toISOString(),by:ME,txt:'Cancellation requested — deprovision within 24h. Billing settled to '+fmtDate(dt(effAt))+'.'});toast('Cancelling · deprovision within 24h');setTimeout(function(){s.status='Cancelled';s.cancelledAt=new Date().toISOString();s.audit.push({t:new Date().toISOString(),by:'system',txt:'Deprovisioned · access revoked · final invoice issued (settled to '+fmtDate(dt(effAt))+').'});renderLife();openBody(s.id);},1500);}
function cancelSub(id){var s=byId(id);var tmin=ymd(new Date(Date.now()+864e5)),tmax=ymd(term(s));var body='<div class="optrow"><label class="opt"><input type="radio" name="cmode" value="now" checked onchange="cmode()"> <span><b>Cancel now</b> — deprovision within 24h</span></label><label class="opt"><input type="radio" name="cmode" value="sched" onchange="cmode()"> <span><b>Schedule a date</b> — stays active &amp; billable until then</span></label></div><div id="cdate" style="display:none;margin-bottom:9px"><label class="flbl">Effective cancellation date</label><input type="date" id="cdt" min="'+tmin+'" max="'+tmax+'" value="'+tmin+'"></div><textarea id="ct" rows="3" placeholder="Cancellation reason (required)…"></textarea>';openModal('Cancel subscription','Billing settles to the effective date; committed / licence terms follow the contract.',body,function(){var txt=document.getElementById('ct').value.trim();if(!txt){document.getElementById('ct').style.borderColor='var(--off)';return false;}var mode=document.querySelector('input[name=cmode]:checked').value;if(mode==='sched'){var d=document.getElementById('cdt').value;if(!d){document.getElementById('cdt').style.borderColor='var(--off)';return false;}s.status='Scheduled';s.scheduledAt=new Date().toISOString();s.scheduledBy=ME;s.effectiveCancelAt=d+'T00:00:00';s.cancelReason=txt;s.audit.push({t:new Date().toISOString(),by:ME,txt:'Cancellation scheduled for '+fmtDate(dt(s.effectiveCancelAt))+' — remains active and billable until then; settlement as of that date.'});renderLife();openBody(id);toast('Cancellation scheduled for '+fmtDate(dt(s.effectiveCancelAt)));return true;}fireCancel(s,new Date().toISOString(),txt);renderLife();openBody(id);return true;},'Confirm',true);}
function unschedule(id){var s=byId(id);openModal('Un-schedule cancellation','Revert to active and remove the scheduled cancellation for '+fmtDate(dt(s.effectiveCancelAt))+'.','',function(){s.status='Active';s.audit.push({t:new Date().toISOString(),by:ME,txt:'Scheduled cancellation removed — subscription remains active.'});delete s.effectiveCancelAt;delete s.scheduledAt;renderLife();openBody(id);toast('Cancellation un-scheduled · subscription active');return true;},'Un-schedule',false);}
function cancelNow(id){var s=byId(id);openModal('Cancel now instead','Override the scheduled date and deprovision within 24h. Billing settles to today.','',function(){fireCancel(s,new Date().toISOString(),s.cancelReason||'Immediate cancellation (override of scheduled date).');renderLife();openBody(id);return true;},'Cancel now',true);}
function runScheduled(id){var s=byId(id);s.audit.push({t:new Date().toISOString(),by:'system',txt:'Scheduled date reached ('+fmtDate(dt(s.effectiveCancelAt))+') — executing cancellation.'});fireCancel(s,s.effectiveCancelAt,s.cancelReason);renderLife();openBody(id);}

function openDrawer(){document.getElementById('scrim').classList.add('on');document.getElementById('drawer').classList.add('on');}
function closeDrawer(){document.getElementById('scrim').classList.remove('on');document.getElementById('drawer').classList.remove('on');}
var MOK=null;
function openModal(t,m,b,ok,lab,danger){document.getElementById('mTitle').textContent=t;document.getElementById('mMsg').textContent=m;document.getElementById('mBody').innerHTML=b;var k=document.getElementById('mOk');k.textContent=lab||'Confirm';k.className='btn sm '+(danger?'danger':'primary');MOK=ok;document.getElementById('mscrim').classList.add('on');}
document.getElementById('mOk').onclick=function(){if(MOK){var r=MOK();if(r!==false)closeModal();}};
function closeModal(){document.getElementById('mscrim').classList.remove('on');MOK=null;}
var TT;function toast(m){var t=document.getElementById('toast');t.innerHTML=m;t.classList.add('on');clearTimeout(TT);TT=setTimeout(function(){t.classList.remove('on');},2600);}

REQUESTS=loadLiveRequests().concat(REQUESTS);
fillFilters();renderReq();fillLifeTenant();
window.addEventListener('storage',function(e){if(!e||e.key===LIVE_KEY||e.key===null)refreshLive();});
